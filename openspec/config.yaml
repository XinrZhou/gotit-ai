schema: spec-driven

# Injected into agent context for OpenSpec workflows
context: |
  gotit-ai is a daily learning companion: personality-bearing agents talk with
  you in threads, remember across sessions, and run a verify-loop workflow
  (false fluency → examine → recheck → deterministic gate). Verification is
  the spine; the companion owns the chat surface.
  Stack: Python 3.12 + uv + FastAPI + MCP; React web via npm; Postgres + Redis.
  OpenClaw is an optional distribution channel (gotit exposes MCP tools).
  Keep gotit.core framework-free. Verified = done. The mastery gate is
  deterministic code, never an LLM. Harness evidence for prompt/skill adopts.

rules:
  proposal:
    - Tie every change to verification outcomes or harness/tooling that enables them.
  specs:
    - Prefer SHALL requirements with concrete scenarios (given/when/then).
  design:
    - Call out REST/MCP schema parity and Postgres/Redis impact.
  tasks:
    - Include test or harness steps; mark gate commands explicitly.
