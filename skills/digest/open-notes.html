<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>打开备忘录</title>
    <meta
      http-equiv="refresh"
      content="0;url=mobilenotes://"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        line-height: 1.45;
        color: #6e6e73;
      }
      a.btn {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border-radius: 980px;
        background: #1d1d1f;
        color: #fff;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #86868b;
      }
    </style>
    <script>
      // Immediate attempt (works best outside WeChat, or after "Open in Safari").
      (function () {
        var targets = ["mobilenotes://", "notes://"];
        var i = 0;
        function go() {
          if (i >= targets.length) return;
          window.location.href = targets[i++];
          setTimeout(go, 400);
        }
        go();
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>打开备忘录</h1>
      <p>
        若未自动跳转，请点下方按钮。微信内若无效：右上角 ··· →
        「在 Safari 中打开」后再试。
      </p>
      <p>
        <a class="btn" href="mobilenotes://">打开备忘录 App</a>
      </p>
      <p class="hint">写完后回到微信，回复「导入计划」。</p>
    </main>
  </body>
</html>
