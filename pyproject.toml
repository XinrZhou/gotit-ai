[project]
name = "gotit-ai"
version = "0.1.0"
description = "Personal single-user tech-growth companion — Got it? Prove it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "openai>=1.60.0",
  "mcp>=1.6.0",
  "python-dotenv>=1.0.1",
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "pydantic-ai>=0.30.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
]

[project.scripts]
gotit-api = "gotit.api.main:main"
gotit-mcp = "gotit.mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gotit"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gotit"]

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true
