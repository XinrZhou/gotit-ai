services:
  postgres:
    image: postgres:16-alpine
    container_name: gotit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotit
      POSTGRES_PASSWORD: gotit
      POSTGRES_DB: gotit
    ports:
      - "5432:5432"
    volumes:
      - gotit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotit -d gotit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gotit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gotit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gotit_pg_data:
  gotit_redis_data:
